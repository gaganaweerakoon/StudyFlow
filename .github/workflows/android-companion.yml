name: Android companion preview

on:
  workflow_dispatch:
  push:
    branches: [mobile-companion-integration]
    paths:
      - .github/workflows/**
      - android/**
      - src/**
      - src-tauri/**
      - server/**
      - package.json
      - bun.lock
      - index.html
      - vite.config.ts
      - vite.android.config.ts
      - tsconfig.json

permissions:
  contents: read

jobs:
  package-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: node --import tsx --test src/mobile/companionLogic.test.ts server/companion/relay.test.mjs
      - run: node node_modules/vite/bin/vite.js build --config vite.android.config.ts
      - run: gradle -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: studyflow-android-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
