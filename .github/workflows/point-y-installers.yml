name: StudyFlow Windows and Android package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Set up the Rust MSVC toolchain
        run: rustup default stable-x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Check TypeScript
        run: bun run lint
      - name: Run existing tests
        run: node --import tsx --test src/utils/studyLogic.test.ts src/utils/workspaceMetrics.test.ts src/companion/offlineFocus.test.ts server/studyAssistant.test.ts
      - name: Test Rust storage and Pip
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p studyflow-storage -p studyflow-assistant -p studyflow-local-companion
      - name: Verify the default Gemini model with the native desktop transport
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          $status = curl.exe --silent --show-error --max-time 15 --output NUL --write-out "%{http_code}" "https://generativelanguage.googleapis.com/v1beta/models"
          Write-Host "Gemini endpoint HTTP status without credentials: $status"
          cargo run --locked --manifest-path src-tauri/Cargo.toml --example gemini_smoke
      - name: Build the installer
        env:
          STUDYFLOW_GOOGLE_CLIENT_ID: ${{ secrets.STUDYFLOW_GOOGLE_CLIENT_ID }}
          STUDYFLOW_GOOGLE_CLIENT_SECRET: ${{ secrets.STUDYFLOW_GOOGLE_CLIENT_SECRET }}
        run: bun run tauri build --target x86_64-pc-windows-msvc -- --locked
      - name: Upload the Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: studyflow-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
  package-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: node --import tsx --test src/mobile/companionLogic.test.ts src/companion/offlineFocus.test.ts server/companion/relay.test.mjs
      - run: node node_modules/vite/bin/vite.js build --config vite.android.config.ts
      - run: gradle -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: studyflow-android-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  combined-package:
    runs-on: ubuntu-latest
    needs: [windows-installer, package-preview]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: studyflow-windows-x64
          path: installers
      - uses: actions/download-artifact@v4
        with:
          name: studyflow-android-preview
          path: installers
      - name: Verify installers
        run: |
          test "$(find installers -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find installers -type f -name '*.apk' | wc -l)" -eq 1
          ls -lh installers
          sha256sum installers/*
      - uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-Point-Y-Windows-Android
          path: installers/*
          if-no-files-found: error
