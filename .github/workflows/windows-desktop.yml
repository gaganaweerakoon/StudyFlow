name: Windows desktop build

on:
  workflow_dispatch:
  push:
    branches: [build/windows-gemini-b7ed3b7, mobile-widget-status-update]
# Cancel superseded builds when source files are committed in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Set up the Rust MSVC toolchain
        run: rustup default stable-x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Check TypeScript
        run: bun run lint
      - name: Run existing tests
        run: node --import tsx --test src/utils/studyLogic.test.ts src/utils/workspaceMetrics.test.ts src/companion/offlineFocus.test.ts server/studyAssistant.test.ts
      - name: Test Rust storage and Pip
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p studyflow-storage -p studyflow-assistant -p studyflow-local-companion
      - name: Verify the default Gemini model with the native desktop transport
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          $status = curl.exe --silent --show-error --max-time 15 --output NUL --write-out "%{http_code}" "https://generativelanguage.googleapis.com/v1beta/models"
          Write-Host "Gemini endpoint HTTP status without credentials: $status"
          cargo run --locked --manifest-path src-tauri/Cargo.toml --example gemini_smoke
      - name: Build the installer
        env:
          STUDYFLOW_GOOGLE_CLIENT_ID: ${{ secrets.STUDYFLOW_GOOGLE_CLIENT_ID }}
          STUDYFLOW_GOOGLE_CLIENT_SECRET: ${{ secrets.STUDYFLOW_GOOGLE_CLIENT_SECRET }}
        run: bun run tauri build --target x86_64-pc-windows-msvc -- --locked
      - name: Upload the Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: studyflow-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
