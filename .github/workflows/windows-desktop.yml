name: Windows desktop build

on:
  push:
    branches: [rust-desktop-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Set up the Rust MSVC toolchain
        run: rustup default stable-x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Check TypeScript
        run: bun run lint
      - name: Run existing tests
        run: node --import tsx --test src/utils/studyLogic.test.ts server/studyAssistant.test.ts
      - name: Test Rust storage and Pip
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p studyflow-storage -p studyflow-assistant
      - name: Build the installer
        run: bun run tauri build --target x86_64-pc-windows-msvc -- --locked
      - name: Upload the Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: studyflow-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
