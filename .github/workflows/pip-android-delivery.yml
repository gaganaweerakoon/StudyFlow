name: Pip native Android delivery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - run: bun install --frozen-lockfile
      - run: bun x vite build --config vite.android.config.ts
      - name: Build an isolated debug fixture for the emulator
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout /tmp/pip-key.pem -out /tmp/pip-cert.pem -subj /CN=localhost -addext subjectAltName=DNS:localhost
          DEBUG=android/app/src/debug
          mkdir -p "$DEBUG/res/xml" "$DEBUG/res/raw"
          cp /tmp/pip-cert.pem "$DEBUG/res/raw/pip_test_root.pem"
          cat > "$DEBUG/AndroidManifest.xml" <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:networkSecurityConfig="@xml/pip_test_network" />
          </manifest>
          MANIFEST
          cat > "$DEBUG/res/xml/pip_test_network.xml" <<'CONFIG'
          <network-security-config><domain-config cleartextTrafficPermitted="false"><domain>localhost</domain><trust-anchors><certificates src="@raw/pip_test_root" /></trust-anchors></domain-config></network-security-config>
          CONFIG
          sed -i '/super.onCreate(savedInstanceState)/a\        PipDeliverySettings.schedule(this)' android/app/src/main/java/io/github/gaganaweerakoon/studyflow/MainActivity.kt
          gradle -p android :app:assembleDebug
      - name: Grant emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            node tests/pip/android-delivery.mjs /tmp/pip-key.pem /tmp/pip-cert.pem
