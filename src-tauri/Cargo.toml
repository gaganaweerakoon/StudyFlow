[package]
name = "studyflow"
version = "2.0.0-alpha.1"
description = "StudyFlow desktop workspace"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
studyflow-storage = { path = "storage" }

[workspace]
members = ["storage"]
resolver = "2"
