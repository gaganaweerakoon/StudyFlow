[package]
name = "studyflow"
version = "2.0.0-alpha.2"
description = "StudyFlow desktop workspace"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
studyflow-assistant = { path = "assistant" }
tokio = { version = "1", features = ["macros", "sync"] }
studyflow-storage = { path = "storage" }

[workspace]
members = ["assistant", "storage"]
resolver = "2"
