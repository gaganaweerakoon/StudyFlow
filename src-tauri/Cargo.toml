[package]
name = "studyflow"
version = "2.0.0-alpha.3"
description = "StudyFlow desktop workspace"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
open = "5"
url = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
base64 = "0.23"
studyflow-assistant = { path = "assistant" }
tokio = { version = "1", features = ["macros", "sync"] }
studyflow-storage = { path = "storage" }

[workspace]
members = ["assistant", "storage"]
resolver = "2"
